<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glint — Open challenge</title>
<style>
  :root { --bg:#15110B; --amber:#F6A823; --ink:#F4ECDD; --muted:#B0A48E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; }
  .wrap { padding:32px; max-width:420px; }
  .mark { width:80px; height:80px; border-radius:20px; background:var(--amber); margin:0 auto 24px; box-shadow:0 0 40px rgba(251,191,36,.5); }
  h1 { font-size:26px; margin-bottom:8px; }
  p { color:var(--muted); margin-bottom:24px; }
  .cta { display:inline-block; background:var(--amber); color:#231a08; font-weight:600; padding:13px 26px; border-radius:13px; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"></div>
  <h1 id="title">Opening your challenge…</h1>
  <p id="msg">If Glint is installed it should open now.</p>
  <a class="cta" id="store" href="https://apps.apple.com/">Get Glint</a>
</div>
<script>
  // GitHub Pages serves this for any unmatched path, e.g. /glint-site/c/<seed>.
  // A challenge link looks like .../c/<seed>; hand the seed to the app via the custom scheme.
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var i = parts.lastIndexOf('c');
    var seed = (i >= 0 && parts.length > i + 1) ? parts[i + 1] : null;
    if (seed) {
      // Try to open the installed app. If it isn't installed, the Get Glint button remains.
      window.location.href = 'glint://c/' + seed;
      setTimeout(function () {
        document.getElementById('title').textContent = 'Get Glint to play this puzzle';
        document.getElementById('msg').textContent = 'Glint isn’t installed yet — grab it free and the challenge will open.';
      }, 1200);
    } else {
      document.getElementById('title').textContent = 'Page not found';
      document.getElementById('msg').textContent = 'That link doesn’t point to a Glint challenge.';
    }
  })();
</script>
</body>
</html>
